version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: siibs_db_container
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha123 # Senha padrão para desenvolvimento
      POSTGRES_DB: siibs
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: